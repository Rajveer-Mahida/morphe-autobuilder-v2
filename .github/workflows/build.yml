name: Build APKs
on:
  workflow_dispatch:
    inputs:
      patch_source:
        description: 'Patch source to build'
        required: true
        type: choice
        default: morphe
        options:
          # >>> brands (generated by `python -m src.scripts.workflow_choices`) >>>
