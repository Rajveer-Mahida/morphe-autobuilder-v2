name: Build APKs
on:
  workflow_dispatch:
    inputs:
      patch_source:
        description: 'Patch source to build ("all" runs the CI workflow for every source)'
        required: true
        type: choice
        default: morphe
        options:
          - all
          # >>> brands (generated by `python -m src.scripts.workflow_choices`) >>>
          - morphe
          - piko
          - adobo
          - ajstrick81
          - akashsriram
          - andrewliang25
          - balu100
          - bearinmindcat
          - bholeykabhakt
          - binarymend
          - brosssh
          - browzomje
          - bufferk
          - byehi98
          - chiggi
          - crimera-piko-newx
          - debakarr
          - devanced
          - dh6k
          - dhrubonai
          - docbt
          - entree3k
          - franticg33k
          - fripe070
          - froggo
          - ggyasin
          - heval99
          - hoodles
          - hooman
          - hushfacebook
          - hushfeed
          - hushgram
          - hushmessenger
          - hushpinterest
          - hushtelegram
          - hushthreads
          - hxreborn
          - hxreborn-tiktok
          - icysymmetra
          - imnoammm
          - imxeren
          - jasonwu1994
          - kondratjev
          - kurageno8156
          - kveld9-kveld
          - kveld9-kveld-extra
          - lain
          - lurk
          - michii
          - mightymich
          - mvaishak
          - mwbra130
          - newuser7171
          - oyasumi
          - pablobaro
          - paresh
          - patchweaver
          - piracola
          - prathxm
          - proteus
          - quantavil
          - quantro100
          - revanced-extended
          - riky
          - rushiranpise
          - satanmerde
          - shaunthesheep
          - smart123s
          - spicetify
          - trimpsuz
          - venus
          - xbadfellax
          - zeldrisho
          # <<< brands <<<
  workflow_call:
    inputs:
      patch_source:
        default: 'morphe'
        type: string
      filter_changelog:
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  # This workflow builds one patch source. "all" hands over to the CI workflow, which
  # runs this one for every source (forced, so each is rebuilt).
  build-all:
    if: inputs.patch_source == 'all'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Start CI for every patch source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f patch_source=all -f force_build=true
          echo "::notice title=Handed over to CI::Every patch source is being built by the CI workflow - follow it in the Actions tab."

  prepare:
    if: inputs.patch_source != 'all'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
      title: ${{ steps.version.outputs.title }}
      prerelease: ${{ steps.set-matrix.outputs.prerelease }}
      patches_pin: ${{ steps.set-matrix.outputs.patches_pin }}
      apk_cache_index: ${{ steps.apk-cache.outputs.index }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
          quiet: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Set matrix based on patch source
        id: set-matrix
        env:
          FILTER_CHANGELOG: ${{ inputs.filter_changelog }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RESULT="$(uv run python -m src.scripts.matrix --source '${{ inputs.patch_source }}')"
          echo "matrix=$(echo "$RESULT" | jq -c '{include}')" >> "$GITHUB_OUTPUT"
          echo "prerelease=$(echo "$RESULT" | jq -r '.prerelease')" >> "$GITHUB_OUTPUT"
          echo "patches_tag=$(echo "$RESULT" | jq -r '.patches_tag')" >> "$GITHUB_OUTPUT"
          echo "title=$(echo "$RESULT" | jq -r '.title')" >> "$GITHUB_OUTPUT"
          echo "patches_pin=$(echo "$RESULT" | jq -r '"\(.patches_source)@\(.patches_spec)=\(.patches_tag)"')" >> "$GITHUB_OUTPUT"

      # Stock APKs are cached as draft releases of this repo (src/core/apk_cache.py).
      # Listing them takes a few API calls, so it is done once here for all build jobs.
      - name: Read the APK cache index
        id: apk-cache
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "index=$(uv run python -m src.core.apk_cache)" >> "$GITHUB_OUTPUT"

      # Releases are named after the patch version they were built from: morphe-2.3.0.
      # A rebuild of the same patch version (a rerun, or an app update) reuses that
      # release, and its tag is moved to the commit being built so the tag never points
      # at code older than the APKs it holds.
      - name: Prepare version and draft release
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE: ${{ inputs.patch_source }}
          PATCHES_TAG: ${{ steps.set-matrix.outputs.patches_tag }}
          TITLE: ${{ steps.set-matrix.outputs.title }}
        run: |
          # GitHub refuses writes for a while when a repo creates content too fast
          # (a full build): wait and try again rather than failing the job.
          retry() { for i in 1 2 3 4; do "$@" && return 0; echo "::warning::'$1 $2 $3' failed, retrying in $((i * 60))s"; sleep $((i * 60)); done; "$@"; }
          PATCHES_VER="${PATCHES_TAG#v}"
          VER="${SOURCE}-${PATCHES_VER}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"
          if gh release view "$VER" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            retry gh release edit "$VER" --draft --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VER" >/dev/null 2>&1; then
              retry gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$VER" -f sha="$GITHUB_SHA" -F force=true >/dev/null
              echo "Moved tag '$VER' to $GITHUB_SHA"
            fi
          else
            retry gh release create "$VER" --draft --target "$GITHUB_SHA" --title "$TITLE" --notes "" --repo "$GITHUB_REPOSITORY"
          fi

  run:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          submodules: true

      - name: Install java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
          quiet: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Start API Solver in background
        run: docker run -d -p 8000:8000 ghcr.io/sarperavci/cloudflarebypassforscraping:latest

      - name: Build APKs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          PATCHES_PIN: ${{ needs.prepare.outputs.patches_pin }}
          APK_CACHE_INDEX: ${{ needs.prepare.outputs.apk_cache_index }}
        run: uv run main.py --target "${{ matrix.id }}" ${{ matrix.arch && format('--arch {0}', matrix.arch) || '' }} --pin-patches "$PATCHES_PIN"

      - name: Upload APKs to draft release
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.version }}
        run: |
          # GitHub refuses writes for a while when a repo creates content too fast
          # (a full build): wait and try again rather than failing the job.
          retry() { for i in 1 2 3 4; do "$@" && return 0; echo "::warning::'$1 $2 $3' failed, retrying in $((i * 60))s"; sleep $((i * 60)); done; "$@"; }
          shopt -s nullglob
          apks=(./build/*.apk)
          if [[ ${#apks[@]} -eq 0 ]]; then
            echo "No APKs to upload, skipping"
            exit 0
          fi
          retry gh release upload "$TAG" "${apks[@]}" --clobber --repo "$GITHUB_REPOSITORY"

      # The build log travels to the release job as an artifact: uploading it to the
      # release and deleting it again cost two GitHub writes per app.
      - name: Name build log
        if: always()
        env:
          LABEL: ${{ matrix.id }}${{ matrix.arch && format('-{0}', matrix.arch) || '' }}
        run: |
          mkdir -p buildlog
          if [[ -s build.md ]]; then cp build.md "buildlog/build-${LABEL}.md"; fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildlog-${{ inputs.patch_source }}-${{ matrix.id }}${{ matrix.arch && format('-{0}', matrix.arch) || '' }}
          path: buildlog/
          if-no-files-found: ignore
          retention-days: 1

  release:
    needs: [prepare, run]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
          quiet: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check if any APKs were uploaded
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.version }}
        run: |
          has=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name | select(endswith(".apk"))] | length > 0')
          echo "has_apks=${has}" >> "$GITHUB_OUTPUT"

      # A rerun in which every app failed has no logs; the release then keeps its old notes.
      - name: Download build logs
        if: steps.check.outputs.has_apks == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: buildlog-${{ inputs.patch_source }}-*
          path: logs
          merge-multiple: true

      - name: Combine logs and finalize release
        if: steps.check.outputs.has_apks == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          TITLE: ${{ needs.prepare.outputs.title }}
        run: |
          retry() { for i in 1 2 3 4; do "$@" && return 0; echo "::warning::'$1 $2 $3' failed, retrying in $((i * 60))s"; sleep $((i * 60)); done; "$@"; }
          mkdir -p logs
          uv run python -m src.scripts.logs --logs-dir logs | sed "s/{TAG}/$TAG/g" > final.md
          ARGS=(--draft=false --title "$TITLE" "--prerelease=${PRERELEASE:-false}")
          if [ -s final.md ]; then ARGS+=(--notes-file final.md); fi
          retry gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" "${ARGS[@]}"

      - name: Send Telegram notification
        if: steps.check.outputs.has_apks == 'true' && env.TG_TOKEN != '' && env.TG_CHAT != ''
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          RELEASE_TITLE: ${{ needs.prepare.outputs.title }}
        run: uv run python -m src.scripts.telegram --brand '${{ inputs.patch_source }}'

      - name: Delete empty draft if no APKs
        if: steps.check.outputs.has_apks != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.version }}
        run: gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
