name: CI
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Build all apps (skip update check)'
        required: true
        type: boolean
        default: false
      only:
        description: 'Only these patch sources, space-separated (e.g. "morphe piko"). Empty = all'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  actions: write

jobs:
  check-versions:
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.get-matrix.outputs.build_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
          quiet: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Start API Solver in background
        run: docker run -d -p 8000:8000 ghcr.io/sarperavci/cloudflarebypassforscraping:latest

      - name: Get build matrix
        id: get-matrix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force_build }}
          ONLY: ${{ inputs.only }}
        run: |
          if [ "$FORCE" = "true" ]; then
            MATRIX="$(uv run python -m src.scripts.matrix --force)"
          else
            MATRIX="$(uv run python -m src.scripts.matrix)"
          fi
          if [ -n "$ONLY" ]; then
            MATRIX="$(jq -c --arg only "$ONLY" '($only | ascii_downcase | split(" ") | map(select(. != ""))) as $keep | map(select(. as $b | $keep | index($b)))' <<<"$MATRIX")"
          fi
          echo "Building: $MATRIX"
          echo "build_matrix=$MATRIX" >> "$GITHUB_OUTPUT"

      - name: Notify skipped build
        if: steps.get-matrix.outputs.build_matrix == '[]'
        run: echo "::notice title=Build Skipped::No new releases detected."

      - name: Clear older runs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list -L400 --repo "$GITHUB_REPOSITORY" --json databaseId -q '.[].databaseId' | tail -n+91 | xargs -IID gh api "repos/$GITHUB_REPOSITORY/actions/runs/ID" -X DELETE || true

  # One build per patch source that has something new. The list comes from config.toml
  # (every brand), so adding a patch source needs no edit here.
  build:
    name: build (${{ matrix.brand }})
    needs: check-versions
    if: needs.check-versions.outputs.build_matrix != '[]' && needs.check-versions.outputs.build_matrix != ''
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        brand: ${{ fromJSON(needs.check-versions.outputs.build_matrix) }}
    uses: ./.github/workflows/build.yml
    with:
      patch_source: ${{ matrix.brand }}
      filter_changelog: ${{ inputs.force_build != true }}
    secrets: inherit
